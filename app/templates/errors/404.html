{% extends "base.html" %}

{% block title %}404 Page Not Found — CampusConnect{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 4rem 1.5rem;">
  <div style="width: 5rem; height: 5rem; background: var(--indigo-50); color: var(--indigo-600); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2.25rem; margin: 0 auto 1.5rem;">
    <i class="fa-solid fa-compass"></i>
  </div>
  <h1 style="font-size: 2.5rem; margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="color: var(--slate-600); font-size: 1.1rem; margin-bottom: 2rem;">
    The event, club profile, or page you are looking for does not exist or may have been relocated.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      Return to Homepage
    </a>
    <a href="{{ url_for('events.index') }}" class="btn btn-secondary">
      Explore Events
    </a>
  </div>
</div>
{% endblock %}
